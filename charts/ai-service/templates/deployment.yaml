apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    helm.sh/chart: {{ include "tuned.common.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.app.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.app.name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        timestamp: {{ now | quote }}
    spec:
      containers:
        - name: {{ .Values.app.name }}
          image: {{ .Values.image.repository }}/{{ .Values.app.name }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "{{ .Values.app.profiles }},{{ .Release.Namespace }}"
            - name: ENVIRONMENT
              value: {{ .Release.Namespace }}
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "{{ .Values.app.port }}"
          ports:
            - name: http-port
              containerPort: {{ .Values.app.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: http-port
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /health
              port: http-port
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
        # This chart has no native-sidecar support to make the container above wait
        # on clamav's readiness, so its cold-start signature download (can take
        # minutes) isn't manifest-enforced here. ai-service's MalwareScanService
        # already fails closed on an unreachable scanner, so a scan attempted during
        # that warm-up window is safely rejected rather than treated as clean.
        - name: clamav
          image: "{{ .Values.clamav.image.repository }}:{{ .Values.clamav.image.tag }}"
          ports:
            - name: clamav-port
              containerPort: 3310
          readinessProbe:
            tcpSocket:
              port: clamav-port
            initialDelaySeconds: {{ .Values.clamav.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.clamav.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.clamav.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.clamav.readinessProbe.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: clamav-port
            initialDelaySeconds: {{ .Values.clamav.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.clamav.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.clamav.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.clamav.livenessProbe.failureThreshold }}
          resources:
            limits:
              cpu: {{ .Values.clamav.resources.limits.cpu }}
              memory: {{ .Values.clamav.resources.limits.memory }}
            requests:
              cpu: {{ .Values.clamav.resources.requests.cpu }}
              memory: {{ .Values.clamav.resources.requests.memory }}
      imagePullSecrets:
        - name: {{ .Values.image.secret }}
