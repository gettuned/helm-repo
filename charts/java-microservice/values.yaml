replicas: 1
revisionHistoryLimit: 1

app:
  name: test-service
  profiles: nonprod
  waitForDatabase: false
  waitForConfigServer: false
  healthEndpoint: /actuator/health

image:
  repository: ghcr.io/gettuned
  tag: main
  pullPolicy: Always
  secret: github-registry-secret

readinessProbe:
  initialDelaySeconds: 45
  periodSeconds: 15
  timeoutSeconds: 40
  failureThreshold: 30

livenessProbe:
  initialDelaySeconds: 45
  periodSeconds: 15
  timeoutSeconds: 40
  failureThreshold: 30

resources:
  # Max heap is a percentage of the container memory limit (JDK 21+ container-aware
  # ergonomics), not a fixed -Xmx, so it scales automatically if the limit changes.
  jvmMaxRamPercentage: "45"
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 20m
    memory: 256Mi

ingress:
  enabled: false
  sslRedirect: false
  prefix: test-service
  host: dev.api.gettuned.co
