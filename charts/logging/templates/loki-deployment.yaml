apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: loki
    helm.sh/chart: {{ include "tuned.common.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        timstamp: {{ now | quote }}
        checksum/config: {{ include (print $.Template.BasePath "/loki-config.yaml") . | sha256sum }}
    spec:
      # grafana/loki's image runs as non-root (uid/gid 10001). A freshly
      # provisioned EBS PVC's mount root is owned by root, so without this,
      # Loki can't mkdir anything under /loki (chunks/, rules/, compactor/) —
      # fails immediately on startup with "permission denied". fsGroup makes
      # kubelet chown the volume's group ownership (and inject 10001 as a
      # supplementary group on the container) on every mount, which is what
      # actually grants the write access; runAsUser/runAsGroup are set
      # explicitly alongside it so this doesn't rely on the image's default.
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: loki
        image: "{{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag }}"
        imagePullPolicy: {{ .Values.loki.image.pullPolicy }}
        args:
          - "-config.file=/etc/loki/loki-config.yaml"
        ports:
        - name: http
          containerPort: 3100
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          failureThreshold: {{ .Values.loki.readinessProbe.failureThreshold }}
          initialDelaySeconds: {{ .Values.loki.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.loki.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.loki.readinessProbe.timeoutSeconds }}
        livenessProbe:
          httpGet:
            path: /ready
            port: http
          failureThreshold: {{ .Values.loki.livenessProbe.failureThreshold }}
          initialDelaySeconds: {{ .Values.loki.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.loki.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.loki.livenessProbe.timeoutSeconds }}
        resources:
          limits:
            cpu: {{ .Values.loki.resources.limits.cpu }}
            memory: {{ .Values.loki.resources.limits.memory }}
          requests:
            cpu: {{ .Values.loki.resources.requests.cpu }}
            memory: {{ .Values.loki.resources.requests.memory }}
        volumeMounts:
        - mountPath: /loki
          name: loki-volume
        - mountPath: /etc/loki
          name: loki-config-volume
      volumes:
      - name: loki-volume
        persistentVolumeClaim:
          claimName: loki-pvc
      - name: loki-config-volume
        configMap:
          name: loki-config
