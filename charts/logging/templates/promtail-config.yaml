apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: promtail
    helm.sh/chart: {{ include "tuned.common.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  promtail-config.yaml: |
    server:
      http_listen_port: 9080

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      # Same-namespace Loki, same release — no tenant header needed, see loki-config.yaml.
      - url: http://loki.{{ .Release.Namespace }}.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["{{ .Release.Namespace }}"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          # Deliberately NOT labeling by pod name — high-cardinality labels
          # (pod, requestId, provider_id, ...) cause Loki's classic "stream
          # explosion" failure mode. Keep indexed labels to
          # namespace/app/container/level; everything else is queryable via
          # `| json` at query time instead.
          #
          # This relabel does NOT create a Loki label — the __ prefix means it's
          # stripped before shipping. It only tells Promtail which on-disk log
          # file(s) this scrape target corresponds to.
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log
        pipeline_stages:
          - cri: {}
          - json:
              expressions:
                level: level
                logger: logger_name
                message: message
              source: message
          - labels:
              level:
          - static_labels:
              job: kubernetes-pods
