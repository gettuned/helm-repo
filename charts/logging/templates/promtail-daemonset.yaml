apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: promtail
    helm.sh/chart: {{ include "tuned.common.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        timstamp: {{ now | quote }}
        checksum/config: {{ include (print $.Template.BasePath "/promtail-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: promtail
      containers:
      - name: promtail
        image: "{{ .Values.promtail.image.repository }}:{{ .Values.promtail.image.tag }}"
        imagePullPolicy: {{ .Values.promtail.image.pullPolicy }}
        args:
          - "-config.file=/etc/promtail/promtail-config.yaml"
        env:
          # Promtail auto-restricts its `role: pod` kubernetes_sd discovery to
          # pods on its OWN node (spec.nodeName=$HOSTNAME) — correct behavior
          # for a DaemonSet, since that's the only node's logs it can read.
          # But a container's hostname defaults to its own POD name, not the
          # real node name, so without this override Promtail filters for a
          # node name that matches nothing and silently discovers 0 targets
          # (no error — it's a valid, just useless, field selector). This is
          # the standard fix (same as Grafana's own reference Promtail chart).
          - name: HOSTNAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        resources:
          limits:
            cpu: {{ .Values.promtail.resources.limits.cpu }}
            memory: {{ .Values.promtail.resources.limits.memory }}
          requests:
            cpu: {{ .Values.promtail.resources.requests.cpu }}
            memory: {{ .Values.promtail.resources.requests.memory }}
        volumeMounts:
        - name: config
          mountPath: /etc/promtail
        - name: pods-logs
          mountPath: /var/log/pods
          readOnly: true
        - name: positions
          mountPath: /run/promtail
      volumes:
      - name: config
        configMap:
          name: promtail-config
      - name: pods-logs
        hostPath:
          path: /var/log/pods
      - name: positions
        emptyDir: {}
      tolerations:
        - effect: NoSchedule
          operator: Exists
