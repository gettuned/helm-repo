apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: loki
    helm.sh/chart: {{ include "tuned.common.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  loki-config.yaml: |
    # Shared instance — dev/prod isolation is by tenant (X-Scope-OrgID), not a
    # label. Promtail releases in dev/prod set tenant_id on their client
    # block; callers must always send X-Scope-OrgID.
    auth_enabled: true

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      replication_factor: 1
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2025-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: {{ .Values.retention.period }}
      reject_old_samples: true
      reject_old_samples_max_age: {{ .Values.retention.period }}
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      per_stream_rate_limit: 5MB
      per_stream_rate_limit_burst: 20MB
      max_query_series: 5000
      max_query_lookback: {{ .Values.retention.period }}
      allow_structured_metadata: true

    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      delete_request_store: filesystem

    query_range:
      cache_results: false # skip result caching in v1 — add memcached later if needed

    ruler:
      enable_api: false

    analytics:
      reporting_enabled: false
