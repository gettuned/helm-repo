image:
  repository: grafana/promtail
  tag: "3.2.0"
  pullPolicy: IfNotPresent

# The Loki tenant this release's logs are pushed under. Deploy tooling passes
# this explicitly (--set tenantId=dev / --set tenantId=prod) so it's visible
# in the install command, but the chart also defaults it to .Release.Namespace
# — see templates/promtail-config.yaml — so a release can never silently ship
# untagged/default-tenant logs even if the flag is dropped by mistake.
tenantId: ""

# Shared Loki instance, deployed once into `utils`. See
# devops/plans/plan-log-aggregation-loki.md.
lokiUrl: http://loki.utils.svc.cluster.local:3100/loki/api/v1/push

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 20m
    memory: 64Mi
