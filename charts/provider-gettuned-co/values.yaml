replicas: 1
revisionHistoryLimit: 1

app:
  name: provider-gettuned-co
  healthEndpoint: /health

image:
  repository: ghcr.io/gettuned
  tag: main
  pullPolicy: Always
  secret: github-registry-secret

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 15
  failureThreshold: 5

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 15
  failureThreshold: 5

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 20m
    memory: 64Mi

ingress:
  enabled: true
  sslRedirect: false
  host: dev.provider.gettuned.co
  # Routes custom provider domains (arbitrary Host headers CloudFront forwards
  # through unmodified) to this app. Only ever renders in the prod namespace —
  # see templates/ingress.yaml — so this can safely default to true without a
  # separate per-environment values file.
  catchAll:
    enabled: true
